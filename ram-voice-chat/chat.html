<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 RAM Chat - โหลดเร็ว ใช้ง่าย</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a1932 0%, #1a2a52 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e0e0e0;
        }

        .container {
            max-width: 600px;
            width: 100%;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: rgba(10, 25, 50, 0.9);
            border-left: 1px solid rgba(0, 255, 200, 0.1);
            border-right: 1px solid rgba(0, 255, 200, 0.1);
        }

        .header {
            padding: 16px 20px;
            background: rgba(0, 255, 200, 0.05);
            border-bottom: 1px solid rgba(0, 255, 200, 0.15);
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #00ffc8, #0064ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status {
            font-size: 12px;
            color: #00ffc8;
            margin-top: 4px;
        }

        .status.error {
            color: #ff6b6b;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ram {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .user .bubble {
            background: linear-gradient(135deg, rgba(0, 255, 200, 0.2), rgba(0, 100, 255, 0.2));
            border: 1px solid rgba(0, 255, 200, 0.3);
            color: #fff;
        }

        .ram .bubble {
            background: linear-gradient(135deg, rgba(200, 0, 255, 0.15), rgba(0, 150, 255, 0.15));
            border: 1px solid rgba(200, 0, 255, 0.3);
            color: #f0f0f0;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .input-section {
            padding: 16px 20px;
            background: rgba(0, 255, 200, 0.03);
            border-top: 1px solid rgba(0, 255, 200, 0.15);
            display: flex;
            gap: 8px;
        }

        .input-form {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(0, 255, 200, 0.05);
            border: 1px solid rgba(0, 255, 200, 0.2);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            background: rgba(0, 255, 200, 0.1);
            border-color: rgba(0, 255, 200, 0.4);
            box-shadow: 0 0 12px rgba(0, 255, 200, 0.2);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #00ffc8, #0064ff);
            border: none;
            border-radius: 8px;
            color: #0a1932;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 200, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .scrollbar-hint {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            padding: 8px;
        }

        /* Scrollbar styling */
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 200, 0.2);
            border-radius: 3px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 200, 0.4);
        }

        @media (max-width: 480px) {
            .bubble {
                max-width: 85%;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 RAM Chat</h1>
            <div class="status" id="status">🔄 เชื่อมต่ออยู่...</div>
        </div>

        <div class="messages" id="messages">
            <div class="empty-state">
                <div class="empty-icon">🎯</div>
                <h2>ยินดีต้อนรับสู่ RAM</h2>
                <p>พิมพ์ข้อความเพื่อเริ่มการสนทนา</p>
            </div>
        </div>

        <div class="input-section">
            <form class="input-form" id="chatForm">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="พิมพ์ข้อความภาษาไทยหรืออังกฤษ..."
                    autocomplete="off"
                >
                <button type="submit" id="sendBtn">ส่ง</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001';
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusDiv = document.getElementById('status');
        const chatForm = document.getElementById('chatForm');

        let isConnected = false;
        let isProcessing = false;

        // ตรวจสอบการเชื่อมต่อ
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();

                if (data.ram === 'connected') {
                    isConnected = true;
                    statusDiv.textContent = '✅ พร้อมใช้งาน';
                    statusDiv.classList.remove('error');
                } else {
                    isConnected = false;
                    statusDiv.textContent = '⚠️ ไม่สามารถเชื่อมต่อ RAM';
                    statusDiv.classList.add('error');
                }
            } catch (error) {
                isConnected = false;
                statusDiv.textContent = '❌ ขาดการเชื่อมต่อกับ Backend (port 3001)';
                statusDiv.classList.add('error');
                console.error('Health check failed:', error);
            }
        }

        // เพิ่มข้อความในแชท
        function addMessage(text, sender) {
            // ลบ empty state ถ้าเป็นข้อความแรก
            const emptyState = messagesDiv.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);

            // Scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ส่งข้อความ
        async function sendMessage(text) {
            if (!text.trim() || !isConnected || isProcessing) {
                return;
            }

            isProcessing = true;
            sendBtn.disabled = true;

            // เพิ่มข้อความของผู้ใช้
            addMessage(text, 'user');
            messageInput.value = '';

            try {
                // ส่งไปยัง API
                const response = await fetch(`${API_BASE}/api/speak`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: text }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // เพิ่มตัวอักษรของ RAM
                addMessage(data.response, 'ram');

                // เล่นเสียง (ถ้ามี)
                if (data.audio) {
                    try {
                        const binary = atob(data.audio);
                        const bytes = new Uint8Array(binary.length);
                        for (let i = 0; i < binary.length; i++) {
                            bytes[i] = binary.charCodeAt(i);
                        }
                        const blob = new Blob([bytes], { type: 'audio/mpeg' });
                        const url = URL.createObjectURL(blob);
                        const audio = new Audio(url);
                        audio.play().catch(err => console.log('Audio playback skipped:', err));
                    } catch (error) {
                        console.log('TTS audio not available');
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage(`❌ ผิดพลาด: ${error.message}`, 'system');
                statusDiv.textContent = '❌ เกิดข้อผิดพลาด - ตรวจสอบ Backend';
                statusDiv.classList.add('error');
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        // Event listeners
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text) {
                sendMessage(text);
            }
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // ตรวจสอบการเชื่อมต่อเมื่อเปิดหน้า
        checkHealth();
        setInterval(checkHealth, 5000); // ตรวจสอบทุก 5 วินาที

        // Focus input เมื่อเปิดหน้า
        messageInput.focus();
    </script>
</body>
</html>
